<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad guiada CSS</title>
    <style>
        p:nth-child(1) {
            background:yellow ;
        }
        p:nth-child(2) {
            background: red;
        }
        p:nth-child(3) {
            background: green;
        }
        p:nth-child(4) {
            background: grey;
        }
        p:nth-child(5) {
            background: purple
        }        
    </style>
    <style>
        p:nth-child(odd) {
            background: blue;
        }
        p:nth-child(even) {
            background: red;
        }
    </style>
</head>
<body>
    <p>p1</p>
    <p>p2</p>
    <p>p3</p>
    <p>p4</p>
    <p>p5</p>
</body>
</html>
