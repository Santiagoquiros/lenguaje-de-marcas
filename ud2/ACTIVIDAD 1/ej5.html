<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de div y span</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="titulo">Bienvenido a mi página</div>
    <div class="descripcion">
       <pre> Esta es una pequeña página de ejemplo que utiliza elementos <span class="resaltado">div</span> y <span class="resaltado">span</span> para estructurar el contenido. 
        Los elementos <span class="resaltado">div</span> se utilizan para crear secciones contenedoras, mientras que los elementos <span class="resaltado">span</span> se utilizan para aplicar estilos a partes específicas del texto.</pre>
    </div>
</div>

</body>
</html>
