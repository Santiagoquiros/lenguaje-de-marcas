<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificación de Elementos HTML</title>
</head>
<body>
    <h1> Clasificación de Elementos HTML</h1>

    <h2>Elementos de estilo</h2>
    <ul>
        <li>&lt;i&gt; - Representa texto en cursiva.</li>
        <li>&lt;b&gt; - Representa texto en negrita.</li>
    </ul>

    <h2>Etiquetas semánticas</h2>
    <ul>
        <li>&lt;strong&gt; - Indica que el texto tiene una importancia especial.</li>
        <li>&lt;em&gt; - Se utiliza para enfatizar el texto.</li>
    </ul>
</body>
</html>
